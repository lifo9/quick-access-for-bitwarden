name: dependabot auto-merge

# Switches on auto-merge for Dependabot's pull requests. GitHub then merges each of them by
# itself once the checks that the rules for main require have passed, and not before.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: enable auto-merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      # Auto-merge waits for the required checks. Without a rule that requires any, there is
      # nothing to wait for and the pull request would merge untested, so the rule comes first.
      - name: check that the base branch requires checks to pass
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          num_check_rules=$(gh api "repos/$REPOSITORY/rules/branches/$BASE_BRANCH" \
            --jq '[.[] | select(.type == "required_status_checks")] | length')
          if [ "$num_check_rules" -eq 0 ]; then
            echo "error: $BASE_BRANCH has no rule that requires status checks; not enabling auto-merge"
            exit 1
          fi

      - name: enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PULL_REQUEST_URL"
